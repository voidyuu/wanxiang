# 本文件的工作目录是在用户根目录，本目录携带是因为如果放外面就会更新的时候覆盖你的修改，因此我只能藏起来。
# 如果没有按初始化说明进行初始化那么你需要手动复制本文件到上层目录，请知悉。
patch:
  # 自定义按键处理器需置于万象自带处理器之前。
  engine/processors/@before 0: lua_processor@*custom_key_select

  # 声调键依次为一、二、三、四声；词库内部声调码仍为 7、8、9、0。
  custom_key_select/tone_keys: "1290"
  custom_key_select/tone_codes: "7890"
  custom_key_select/tone_input_codes: "¹²³⁴"
  # 拼音编码含声调码时，按 Enter 提交删除声调码后的原始文本。
  custom_key_select/strip_tones_on_return: true

  switches:
    - name: ascii_mode # 中英输入状态
      states: [中文, 英文]
      reset: 0
    - name: ascii_punct # 中英标点，可以在中文输入状态输入英文符号
      states: [中标, 英标]
      reset: 0
    - name: full_shape #全角、半角字符输出
      states: [半角, 全角]
      reset: 0
    - name: emoji #候选出现emoji滤镜，会显示在相应的候选后面，万象侧重于tips提示，避免候选被占用，因此默认为reset: 0，归属opencc emoji滤镜
      states: [表情关, 表情开]
      reset: 1
    - name: chinese_english #候选进入翻译模式滤镜，会显示在相应的候选后面，万象侧重于tips提示，避免候选被占用，归属opencc 翻译滤镜
      states: [翻译关, 翻译开]
      reset: 0
    - name: prediction
      states: [预测关, 预测开] # 这个名称能用于插件也能用于万象的lua实现，用来开启关闭预测功能
      reset: 0
    - options: [raw_input, tone_display, full_pinyin] #开启后在输入编码的位置实时转换为带声调全拼或者不带声调全拼，不开启则采用系统配置原始编码，影响的是preedit_format,归属：super_preedit.lua
      states: [原编码, 有声调, 无声调]
      reset: 2 #对于开关组从0开始数，第几个就reset几可设为默认
    - options: [s2s, s2t, s2hk, s2tw] # 简繁转换开关组，可以在一个空选项和多个实际“- simplifier@s2hk”引入的项目之前切换，这是一个开关组，你可以将其中任意一个s2s等设置为toggle快捷键，多次按下将轮询
      states: [简体, 通繁, 港繁, 臺繁]
      reset: 0
    - name: abbrev
      states: [简码关, 简码开]
      reset: 0
    - options: [comment_off, tone_hint, toneless_hint] #开启后在候选的注释里面实时显示全拼声调，不开启则采用系统配置，影响的是comment_format，归属：super_comment.lua
      states: [注释关, 有声调, 无声调]
      reset: 1
    - name: super_tips #开启后在输入编码后面的提示区显示实时的提示数据，受tips数据库影响，表情、翻译、车牌、符号等对应关系数据，并可实现句号上屏，不开启则默认，影响的是segment.prompt参数，归属：super_tips.lua
      states: [提示关, 提示开]
      reset: 0
    - name: charset_filter #字符集过滤，默认开启8105通规显示，即小字集，可通过开关实时开启全字集，快捷键配套ctrl+g,归属：super_filter.lua
      states: [大字集, 小字集]
      reset: 0
    - name: char_priority #多体现在编码重合但候选有单字或者多字的情况`引导的辅码查词时是否单字优先，全拼常见，类似于特定编码情况下、反查状态下的调序能力。归属：super_lookup.lua
      states: [词组先, 单字先]
      reset: 0

  tone_preedit:
    "7": "¹"
    "8": "²"
    "9": "³"
    "0": "⁴"

  speller/algebra:
    __patch:
      #- wanxiang_algebra:/模糊音_z_zh  # 这里取消注释启用，wanxiang_algebra.yaml文件末尾有具体条目，不含的custom自定义即可
      - wanxiang_algebra:/base/小鹤双拼
      # 输入上下文使用上标，拼写运算仍匹配词库内部的 7890。
      - /+:
          - xlit/7890/¹²³⁴/
      # 可选输入方案名称：全拼，自然码, 自然龙, 汉心龙，小鹤双拼, 搜狗双拼, 微软双拼, 智能ABC, 紫光双拼, 国标双拼，拼音加加，乱序17
      ##########################以上格式受指令初始化控制，最好保持格式不变，如果发生变更请不要使用指令修改相关数据#####################################

  speller/alphabet: "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA1234567890¹²³⁴`;/\\›"

  #这里改成什么就需要手动创建同名的 custom_phrasexx.txt 文件在用户目录，这个文件主要用于置顶，编码为自定义编码的词汇
  #custom_phrase/user_dict: custom_phrasexx

  #导入根目录下名称为userxx.dict.yaml的自定义固定词典，编码要与固定词库一致，编码权重都不要少，形如姓名、专有名词公司名称等等
  #translator/packs/+:
  #  - userxx

  #下面是候选数量
  menu/page_size: 3

  #以下恢复``造词功能，也就是平时不记录，引导才记录，按需造词，如果你想恢复这个功能，请取消注释----
  #recognizer/patterns/add_user_dict: "^``[A-Za-z/`']*$"      #自造词引导方式
  #user_dict_set/enable_user_dict: true
  #add_user_dict/enable_user_dict: true
  # 取消注释以开启自动无词频造词
  #add_user_dict/enable_auto_phrase: true
